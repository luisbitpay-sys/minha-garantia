<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Minha Garantia</title><style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#101828;--muted:#667085;--line:#e4e7ec;--accent:#111827;--green:#067647;--greenbg:#ecfdf3;--orange:#b54708;--orangebg:#fffaeb;--red:#b42318;--redbg:#fef3f2}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}.app{max-width:480px;min-height:100vh;margin:auto;background:var(--bg);padding:22px 16px 110px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:23px;font-weight:850;letter-spacing:-.6px}.sub{font-size:13px;color:var(--muted);margin-top:3px}.search{width:100%;border:1px solid var(--line);background:white;border-radius:14px;padding:14px 15px;outline:none;font-size:15px;box-shadow:0 1px 2px #1018280d}.sectionTitle{font-size:12px;font-weight:800;letter-spacing:.08em;color:#475467;margin:24px 2px 10px}.list{display:grid;gap:10px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:0 1px 2px #1018280a;cursor:pointer}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.name{font-weight:800;font-size:16px}.store{font-size:13px;color:var(--muted);margin-top:5px}.badge{font-size:12px;font-weight:800;border-radius:999px;padding:7px 9px;white-space:nowrap}.green{color:var(--green);background:var(--greenbg)}.orange{color:var(--orange);background:var(--orangebg)}.red{color:var(--red);background:var(--redbg)}.empty{text-align:center;color:var(--muted);padding:42px 20px;background:white;border:1px dashed var(--line);border-radius:16px}.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;width:min(calc(100% - 32px),448px);border:0;border-radius:15px;background:var(--accent);color:white;padding:16px;font-weight:850;box-shadow:0 10px 25px #10182833;cursor:pointer}.screen{display:none}.screen.active{display:block}.back{border:0;background:transparent;padding:4px 0 12px;color:#344054;font-weight:700;cursor:pointer}.title{font-size:26px;font-weight:900;letter-spacing:-.7px;margin:4px 0 5px}.lead{color:var(--muted);font-size:14px;margin-bottom:22px}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:750;margin:0 0 7px}.field input{width:100%;border:1px solid var(--line);background:white;border-radius:12px;padding:14px;outline:none}.field input:focus{border-color:#98a2b3;box-shadow:0 0 0 3px #1018280d}.hint{font-size:12px;color:var(--muted);margin-top:5px}.calc{margin:18px 0;background:#eef2f6;border-radius:14px;padding:14px;font-size:13px}.primary{width:100%;border:0;border-radius:13px;background:var(--accent);color:#fff;padding:15px;font-weight:850;cursor:pointer}.secondary{width:100%;border:1px solid var(--line);border-radius:13px;background:white;color:var(--ink);padding:14px;font-weight:800;cursor:pointer;margin-top:10px}.danger{color:var(--red)}.hero{text-align:center;background:white;border:1px solid var(--line);border-radius:20px;padding:26px 16px;margin:18px 0}.days{font-size:58px;line-height:1;font-weight:950;letter-spacing:-2px;margin:14px 0 4px}.daysLabel{font-size:12px;font-weight:850;letter-spacing:.12em;color:var(--muted)}.details{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden}.detail{padding:14px 15px;border-bottom:1px solid var(--line)}.detail:last-child{border-bottom:0}.k{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:800;letter-spacing:.06em}.v{font-size:15px;font-weight:700;margin-top:4px}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#101828;color:white;padding:10px 14px;border-radius:10px;font-size:13px;display:none;z-index:5}.toast.show{display:block}
</style></head><body><div class="toast" id="toast"></div><main class="app">
<section id="home" class="screen active"><div class="top"><div><div class="brand">Minha Garantia</div><div class="sub">Saiba antes de pagar pelo conserto.</div></div></div><input id="search" class="search" placeholder="🔎  Buscar produto, loja ou pedido..."><div class="sectionTitle">MINHAS GARANTIAS</div><div id="list" class="list"></div><button class="fab" id="addBtn">＋ ADICIONAR PRODUTO</button></section>
<section id="form" class="screen"><button class="back" data-home>← Voltar</button><div class="title" id="formTitle">Nova garantia</div><div class="lead">Cadastre sua compra em poucos segundos.</div><form id="productForm"><input type="hidden" id="editId"><div class="field"><label>Produto *</label><input id="product" required placeholder="Ex.: Air Fryer Mondial"></div><div class="field"><label>Loja *</label><input id="store" required placeholder="Ex.: Mercado Livre"></div><div class="field"><label>Número do pedido</label><input id="order" placeholder="Opcional"></div><div class="field"><label>Data da compra *</label><input id="purchase" type="date" required></div><div class="field"><label>Garantia *</label><input id="months" type="number" min="1" max="240" required placeholder="12"><div class="hint">Informe a garantia em meses.</div></div><div class="calc" id="calc">A data de vencimento aparecerá aqui.</div><button class="primary" type="submit">SALVAR</button></form></section>
<section id="detail" class="screen"><button class="back" data-home>← Voltar</button><div class="title" id="detailTitle"></div><div class="hero"><div id="statusBadge" class="badge green" style="display:inline-block"></div><div class="days" id="days"></div><div class="daysLabel" id="daysLabel">DIAS RESTANTES</div></div><div class="details" id="details"></div><button class="secondary" id="editBtn">EDITAR</button><button class="secondary danger" id="deleteBtn">EXCLUIR</button></section>
</main><script>
const $=s=>document.querySelector(s), screens=[...document.querySelectorAll('.screen')];let currentId=null;
const db=()=>JSON.parse(localStorage.getItem('minhaGarantia.products')||'[]');const save=x=>localStorage.setItem('minhaGarantia.products',JSON.stringify(x));
function show(id){screens.forEach(s=>s.classList.toggle('active',s.id===id));scrollTo(0,0)}function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1600)}
function addMonths(dateStr,m){let d=new Date(dateStr+'T12:00:00');let day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+Number(m));let last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return d}
function fmt(d){return new Intl.DateTimeFormat('pt-BR').format(d)}function diffDays(d){let now=new Date();now.setHours(0,0,0,0);let x=new Date(d);x.setHours(0,0,0,0);return Math.ceil((x-now)/86400000)}
function status(p){let end=addMonths(p.purchase,p.months),n=diffDays(end);if(n<0)return {n,label:'Garantia vencida',cls:'red'};if(n<=30)return {n,label:n+' dias restantes',cls:'orange'};return {n,label:n+' dias restantes',cls:'green'}}
function render(){let q=$('#search').value.trim().toLowerCase(),items=db().filter(p=>[p.product,p.store,p.order].join(' ').toLowerCase().includes(q));let el=$('#list');if(!items.length){el.innerHTML='<div class="empty">'+(q?'Nenhuma garantia encontrada.':'Nenhum produto cadastrado ainda.<br><br>Comece adicionando sua primeira garantia.')+'</div>';return}el.innerHTML=items.sort((a,b)=>new Date(b.created)-new Date(a.created)).map(p=>{let s=status(p);return `<div class="card" data-id="${p.id}"><div class="row"><div><div class="name">${esc(p.product)}</div><div class="store">${esc(p.store)}${p.order?' · Pedido '+esc(p.order):''}</div></div><div class="badge ${s.cls}">${s.label}</div></div></div>`}).join('');document.querySelectorAll('.card').forEach(c=>c.onclick=()=>openDetail(c.dataset.id))}
function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function calc(){let d=$('#purchase').value,m=$('#months').value;$('#calc').textContent=d&&m?'Garantia até: '+fmt(addMonths(d,m)):'A data de vencimento aparecerá aqui.'}
function openForm(p=null){$('#productForm').reset();$('#editId').value=p?.id||'';$('#formTitle').textContent=p?'Editar garantia':'Nova garantia';if(p){$('#product').value=p.product;$('#store').value=p.store;$('#order').value=p.order||'';$('#purchase').value=p.purchase;$('#months').value=p.months}calc();show('form')}
function openDetail(id){let p=db().find(x=>x.id===id);if(!p)return;currentId=id;let s=status(p),end=addMonths(p.purchase,p.months);$('#detailTitle').textContent=p.product;let b=$('#statusBadge');b.className='badge '+s.cls;b.textContent=s.n<0?'🔴 GARANTIA VENCIDA':s.n<=30?'🟠 GARANTIA TERMINANDO':'🟢 GARANTIA ATIVA';$('#days').textContent=Math.abs(s.n);$('#daysLabel').textContent=s.n<0?'DIAS DESDE O VENCIMENTO':'DIAS RESTANTES';$('#details').innerHTML=`<div class="detail"><div class="k">Loja</div><div class="v">${esc(p.store)}</div></div><div class="detail"><div class="k">Número do pedido</div><div class="v">${p.order?esc(p.order):'Não informado'}</div></div><div class="detail"><div class="k">Data da compra</div><div class="v">${fmt(new Date(p.purchase+'T12:00:00'))}</div></div><div class="detail"><div class="k">Garantia</div><div class="v">${p.months} meses</div></div><div class="detail"><div class="k">Vencimento</div><div class="v">${fmt(end)}</div></div>`;show('detail')}
$('#addBtn').onclick=()=>openForm();document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>{render();show('home')});$('#search').oninput=render;$('#purchase').onchange=calc;$('#months').oninput=calc;
$('#productForm').onsubmit=e=>{e.preventDefault();let items=db(),id=$('#editId').value||crypto.randomUUID(),old=items.find(x=>x.id===id);let p={id,product:$('#product').value.trim(),store:$('#store').value.trim(),order:$('#order').value.trim(),purchase:$('#purchase').value,months:Number($('#months').value),created:old?.created||new Date().toISOString()};items=items.filter(x=>x.id!==id);items.push(p);save(items);toast('Garantia salva ✓');render();openDetail(id)};
$('#editBtn').onclick=()=>{let p=db().find(x=>x.id===currentId);if(p)openForm(p)};$('#deleteBtn').onclick=()=>{if(!confirm('Excluir esta garantia?'))return;save(db().filter(x=>x.id!==currentId));currentId=null;toast('Garantia excluída');render();show('home')};render();
</script></body></html>
