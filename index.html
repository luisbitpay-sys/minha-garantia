<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><title>Minha Garantia</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f7f9;color:#101828}.app{max-width:650px;margin:auto;padding:22px 16px 80px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:18px;margin-bottom:12px}h1{font-size:27px;margin:8px 0}.lead,.meta{color:#667085}.field{margin:13px 0}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input{width:100%;padding:14px;border:1px solid #e4e7ec;border-radius:12px;font-size:15px}button{cursor:pointer}.btn{width:100%;padding:14px;border-radius:13px;font-weight:800;border:0}.primary{background:#111827;color:#fff}.secondary{background:#fff;border:1px solid #e4e7ec;margin-top:9px}.hidden{display:none}.msg{padding:10px;border-radius:10px;margin:10px 0;background:#fef3f2;color:#b42318}.ok{background:#ecfdf3;color:#067647}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.brand{font-weight:900;font-size:20px}.search{margin-bottom:12px}.item{display:flex;justify-content:space-between;gap:10px}.badge{font-size:11px;font-weight:800;padding:6px 8px;border-radius:99px;white-space:nowrap}.green{background:#ecfdf3;color:#067647}.red{background:#fef3f2;color:#b42318}.orange{background:#fffaeb;color:#b54708}.actions{display:flex;gap:8px;margin-top:12px}.actions button{padding:8px;border:1px solid #e4e7ec;background:white;border-radius:9px}.price{font-size:38px;font-weight:900}.small{font-size:12px;color:#667085}</style></head><body><div class="app">
<section id="auth"><div class="card"><div class="brand">🛡️ Minha Garantia</div><h1>Suas garantias, em um só lugar.</h1><p class="lead">Saiba antes de pagar pelo conserto.</p><div id="am"></div><div class="field"><label>E-mail</label><input id="email" type="email"></div><div class="field"><label>Senha</label><input id="pass" type="password" placeholder="Mínimo 6 caracteres"></div><button id="login" class="btn primary">Entrar</button><button id="signup" class="btn secondary">Criar minha conta</button></div></section>
<section id="pay" class="hidden"><div class="card" style="text-align:center"><div class="brand">🛡️ Minha Garantia</div><h1>Acesso completo</h1><p class="lead">Pagamento único. Sem mensalidade.</p><div class="price">R$ 19,90</div><p class="lead">Sua conta está criada. Faça o pagamento para liberar seu acesso.</p><div id="pm"></div><button id="buy" class="btn primary">Comprar acesso — R$ 19,90</button><button id="logout1" class="btn secondary">Sair</button></div></section>
<section id="main" class="hidden"><div class="top"><div><div class="brand">🛡️ Minha Garantia</div><div class="small">Sincronizado na nuvem</div></div><button id="logout2">Sair</button></div><div class="card"><h1 id="ft">Cadastrar garantia</h1><div id="fm"></div><div class="field"><label>Produto</label><input id="product"></div><div class="field"><label>Loja</label><input id="store"></div><div class="field"><label>Número do pedido (opcional)</label><input id="order"></div><div class="field"><label>Data da compra</label><input id="date" type="date"></div><div class="field"><label>Garantia (meses)</label><input id="months" type="number" min="1" value="12"></div><button id="save" class="btn primary">Salvar garantia</button><button id="cancel" class="btn secondary hidden">Cancelar edição</button></div><input id="search" class="search" placeholder="🔎 Buscar produto, loja ou pedido"><div id="list"></div></section>
</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient("https://gpgfvkcccwnxptbklnxs.supabase.co","sb_publishable_0XF3PnHHvvG_NNPtM8PIiw_yKUUu5oA");let user=null,items=[],edit=null;const $=x=>document.getElementById(x);
function show(x){["auth","pay","main"].forEach(i=>$(i).classList.add("hidden"));$(x).classList.remove("hidden")}
function message(id,t,ok=false){$(id).innerHTML=t?`<div class="msg ${ok?"ok":""}">${t}</div>`:""}
async function route(){let r=await sb.from("profiles").select("paid").eq("id",user.id).single();if(r.error){show("auth");message("am",r.error.message);return}if(!r.data.paid){show("pay");return}show("main");load()}
$("signup").onclick=async()=>{let r=await sb.auth.signUp({email:$("email").value.trim(),password:$("pass").value});if(r.error)return message("am",r.error.message);if(r.data.session){user=r.data.user;route()}else message("am","Conta criada. Confirme o e-mail e depois entre.",true)};
$("login").onclick=async()=>{let r=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("pass").value});if(r.error)return message("am",r.error.message);user=r.data.user;route()};
async function checkout(){
  const b=$("buy");
  b.disabled=true;b.style.opacity=".65";b.textContent="Abrindo Mercado Pago...";message("pm","");
  try{
    const {data,error}=await sb.functions.invoke("criar-checkout",{body:{}});
    if(error)throw error;
    const url=data?.sandbox_url||data?.checkout_url;
    if(!url)throw new Error(data?.error||"Checkout não retornou um link de pagamento.");
    location.href=url;
  }catch(e){
    message("pm",e?.message||"Não foi possível abrir o pagamento.");
    b.disabled=false;b.style.opacity="1";b.textContent="Comprar acesso — R$ 19,90";
  }
}
$("buy").onclick=checkout;
async function logout(){await sb.auth.signOut();show("auth")}$("logout1").onclick=logout;$("logout2").onclick=logout;
async function load(){let r=await sb.from("warranties").select("*").order("created_at",{ascending:false});if(r.error)return alert(r.error.message);items=r.data||[];render()}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function stat(w){let d=new Date(w.purchase_date+"T00:00:00");d.setMonth(d.getMonth()+Number(w.warranty_months));let n=Math.ceil((d-new Date())/86400000);return n<0?["EXPIRADA","red",n]:n<=30?["TERMINANDO","orange",n]:["ATIVA","green",n]}
function render(){let q=$("search").value.toLowerCase();let a=items.filter(w=>[w.product_name,w.store,w.order_number].some(v=>(v||"").toLowerCase().includes(q)));$("list").innerHTML=a.length?a.map(w=>{let s=stat(w);return `<div class="card"><div class="item"><div><b>${esc(w.product_name)}</b><div class="meta">${esc(w.store)}${w.order_number?" • "+esc(w.order_number):""}</div></div><span class="badge ${s[1]}">${s[0]}</span></div><div class="meta" style="margin-top:8px">${w.warranty_months} meses • ${s[2]>=0?s[2]+" dias restantes":"vencida"}</div><div class="actions"><button onclick="ed('${w.id}')">Editar</button><button onclick="del('${w.id}')">Excluir</button></div></div>`}).join(""):`<div class="card meta">Nenhuma garantia cadastrada.</div>`}
$("search").oninput=render;
$("save").onclick=async()=>{let p={user_id:user.id,product_name:$("product").value.trim(),store:$("store").value.trim(),order_number:$("order").value.trim()||null,purchase_date:$("date").value,warranty_months:Number($("months").value)};if(!p.product_name||!p.store||!p.purchase_date||!p.warranty_months)return message("fm","Preencha os campos obrigatórios.");let r=edit?await sb.from("warranties").update(p).eq("id",edit):await sb.from("warranties").insert(p);if(r.error)return message("fm",r.error.message);clear();load()};
window.ed=id=>{let w=items.find(x=>x.id===id);edit=id;$("product").value=w.product_name;$("store").value=w.store;$("order").value=w.order_number||"";$("date").value=w.purchase_date;$("months").value=w.warranty_months;$("ft").textContent="Editar garantia";$("cancel").classList.remove("hidden");scrollTo(0,0)};
window.del=async id=>{if(confirm("Excluir esta garantia?")){let r=await sb.from("warranties").delete().eq("id",id);if(r.error)alert(r.error.message);else load()}};
function clear(){edit=null;["product","store","order","date"].forEach(x=>$(x).value="");$("months").value=12;$("ft").textContent="Cadastrar garantia";$("cancel").classList.add("hidden");message("fm","")}$("cancel").onclick=clear;
(async()=>{let r=await sb.auth.getSession();if(r.data.session){user=r.data.session.user;route()}else show("auth")})();
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
</script></body></html>
